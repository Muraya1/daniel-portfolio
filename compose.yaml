name: daniel-portfolio

services:
  portfolio:
    build: .
    image: daniel-portfolio:1.0
    restart: unless-stopped
    networks:
      - frontend

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fileguard_frontend"
      - "traefik.http.routers.portfolio.rule=Host(`portfolio.netsecdan.tech`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portfolio.service=portfolio"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

networks:
  frontend:
    external: true
    name: fileguard_frontend

