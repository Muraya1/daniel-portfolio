name: daniel-portfolio
services:
  web:
    build: .
    image: daniel-portfolio:1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}"
      - "traefik.http.routers.daniel-portfolio.rule=Host(`${PORTFOLIO_DOMAIN:?Set PORTFOLIO_DOMAIN in .env}`)"
      - "traefik.http.routers.daniel-portfolio.entrypoints=websecure"
      - "traefik.http.routers.daniel-portfolio.tls=true"
      - "traefik.http.routers.daniel-portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.daniel-portfolio.service=daniel-portfolio"
      - "traefik.http.services.daniel-portfolio.loadbalancer.server.port=80"
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}